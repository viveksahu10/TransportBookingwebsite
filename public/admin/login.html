<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Sahu Transport & Logistics</title>

  <!-- Same CSS variables/colors/fonts as main site -->
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">

  <!-- Google Fonts (same as main site) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="admin-body">

  <div class="admin-login-wrapper">
    <div class="admin-login-card">

      <p class="logo">🚛 Sahu <span>Admin</span></p>
      <p class="admin-login-subtitle">Login to manage transport bookings</p>

      <div class="admin-error" id="loginError"></div>

      <form class="admin-form" id="loginForm">
        <div>
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter admin username" required autocomplete="username">
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
        </div>
        <button type="submit" class="admin-btn" id="loginBtn">Login</button>
      </form>

    </div>
  </div>

  <script>
    'use strict';

    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginBtn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.remove('show');
      loginBtn.textContent = 'Logging in...';
      loginBtn.disabled = true;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.success) {
          window.location.href = '/admin/dashboard.html';
        } else {
          loginError.textContent = data.message || 'Login failed.';
          loginError.classList.add('show');
        }
      } catch (err) {
        loginError.textContent = 'Server connection failed. Please try again.';
        loginError.classList.add('show');
      } finally {
        loginBtn.textContent = 'Login';
        loginBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
